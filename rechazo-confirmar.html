<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Rechazar documento | FID by Lakaut</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Open+Sans:wght@400;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/header.css" />
  <link rel="stylesheet" href="assets/css/buttons.css" />

  <style>
    .main-card { align-items: center; justify-content: center; gap: 54px; min-height: 657px; }

    .confirm-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      width: 100%;
      max-width: 484px;
    }

    .confirm-icon-wrap {
      width: 112px;
      height: 112px;
      flex-shrink: 0;
      border-radius: 32px;
      background: var(--danger-bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .confirm-icon-wrap .icon { font-size: 56px; color: var(--danger); }

    .confirm-title-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
      text-align: center;
      width: 100%;
    }

    .confirm-title {
      font-family: 'Open Sans', sans-serif;
      font-weight: 600;
      font-size: 24px;
      line-height: 32px;
      color: var(--text-main);
    }

    .confirm-subtitle {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: 14px;
      line-height: 20px;
      color: var(--text-help);
      letter-spacing: 0.1px;
    }

    .btn-row { width: 100%; }
    .btn-row > button { flex: 1; }

    @media (max-width: 640px) {
      .main-card { flex: 1; }
      .confirm-content { max-width: 100%; justify-content: center; flex: 1; }
      .btn-row { margin-top: auto; }
    }
  </style>
</head>
<body>
<div class="page">

  <!-- ── HEADER ── -->
  <header class="header">
    <img class="header-logo" src="assets/icons/logo-fid.svg" alt="FID by Lakaut" width="55" height="38" />
    <span class="header-title"><span class="header-title-skeleton"></span></span>
    <button class="icon-btn" aria-label="Cerrar" onclick="window.location.href='index.html'">
      <span class="icon">close</span>
    </button>
  </header>

  <!-- ── CONTENT ── -->
  <main class="content-area">
  <div class="card-wrap">
    <div class="main-card">

      <div class="confirm-content">

        <div class="confirm-icon-wrap">
          <span class="icon">error</span>
        </div>

        <div class="confirm-title-block">
          <h2 class="confirm-title">¿Querés rechazar este documento?</h2>
          <p class="confirm-subtitle">Tené en cuenta que esta acción no se puede deshacer.</p>
        </div>

      </div>

      <!-- Botones -->
      <div class="btn-row">
        <button class="btn-outline" onclick="history.back()">
          <span>Volver</span>
        </button>
        <button class="btn-danger" onclick="window.location.href='rechazo-exitoso.html'">
          <span>Rechazar documento</span>
        </button>
      </div>

    </div><!-- /.main-card -->

    <!-- Footer -->
    <div class="card-footer">
      <span class="powered-label">POWERED BY</span>
      <img class="powered-logo" src="assets/icons/logo-fid.svg" alt="FID by Lakaut" />
    </div>

  </div><!-- /.card-wrap -->
  </main>

</div>
</body>
</html>
