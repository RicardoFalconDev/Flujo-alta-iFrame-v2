<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Rechazar documento | FID by Lakaut</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Open+Sans:wght@400;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/header.css" />
  <link rel="stylesheet" href="assets/css/buttons.css" />

  <style>
    .rechazo-icon-wrap {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--danger-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
    }

    .rechazo-icon-wrap .icon {
      font-size: 32px;
      color: var(--danger);
    }

    .rechazo-title-block {
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: center;
      margin-top: 24px;
    }

    @media (max-width: 640px) {
      .main-card { flex: 1; }
      .btn-row { margin-top: auto; }
    }
  </style>
</head>
<body>
<div class="page">

  <!-- ── HEADER ── -->
  <header class="header">
    <img class="header-logo" src="assets/icons/logo-fid.svg" alt="FID by Lakaut" width="55" height="38" />
    <span class="header-title"><span class="header-title-skeleton"></span></span>
    <button class="icon-btn" aria-label="Cerrar" onclick="window.location.href='index.html'">
      <span class="icon">close</span>
    </button>
  </header>

  <!-- ── CONTENT ── -->
  <main class="content-area">
  <div class="card-wrap">
    <div class="main-card">

      <div class="rechazo-icon-wrap">
        <span class="icon">report</span>
      </div>

      <div class="rechazo-title-block">
        <h2 class="card-title">¿Querés rechazar este documento?</h2>
        <p class="card-subtitle">Esta acción no se puede deshacer. El firmante que envió el documento será notificado del rechazo.</p>
      </div>

      <div class="btn-row">
        <button class="btn-outline" onclick="history.back()">
          <span>Volver</span>
        </button>
        <button class="btn-danger" onclick="window.location.href='rechazo-exitoso.html'">
          <span>Rechazar documento</span>
        </button>
      </div>

    </div><!-- /.main-card -->

    <!-- Footer -->
    <div class="card-footer">
      <span class="powered-label">POWERED BY</span>
      <img class="powered-logo" src="assets/icons/logo-fid.svg" alt="FID by Lakaut" />
    </div>

  </div><!-- /.card-wrap -->
  </main>

</div>
</body>
</html>
