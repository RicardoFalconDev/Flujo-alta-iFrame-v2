<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Cambiar método de autenticación | FID by Lakaut</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Open+Sans:wght@400;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/header.css" />
  <link rel="stylesheet" href="assets/css/buttons.css" />

  <style>
    .main-card { gap: 32px; }
    .form-body { display: flex; flex-direction: column; gap: 52px; width: 100%; }

    .method-option {
      display: flex;
      gap: 20px;
      align-items: center;
      width: 100%;
      padding: 25px;
      background: #fff;
      border: 1px solid var(--border-card);
      border-radius: 12px;
    }

    .method-option-icon {
      width: 56px;
      height: 56px;
      flex-shrink: 0;
      border-radius: 9999px;
      background: #f2f3fe;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--blue);
    }

    .method-option-icon .icon { font-size: 24px; }

    .method-option-text { display: flex; flex-direction: column; }

    .method-option-title {
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: var(--text-dark);
    }

    .method-option-subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      line-height: 20px;
      color: #6b7280;
      padding-top: 5px;
    }

    .method-option-subtitle strong { font-weight: 700; }

    .btn-row { width: 100%; }
    .btn-row > button { flex: 1; }

    @media (max-width: 640px) {
      .main-card { flex: 1; }
      .form-body { flex: 1; }
      .btn-row { margin-top: auto; }
    }
  </style>
</head>
<body>
<div class="page">

  <!-- ── HEADER ── -->
  <header class="header">
    <img class="header-logo" src="assets/icons/logo-fid.svg" alt="FID by Lakaut" width="55" height="38" />
    <span class="header-title"><span class="header-title-skeleton"></span></span>
    <button class="icon-btn" aria-label="Cerrar" onclick="window.location.href='index.html'">
      <span class="icon">close</span>
    </button>
  </header>

  <!-- ── CONTENT ── -->
  <main class="content-area">
  <div class="card-wrap">
    <div class="main-card">

      <!-- Título -->
      <div class="title-section" style="text-align:center;">
        <h2 class="card-title">Cambiar método de autenticación</h2>
        <p class="card-subtitle" id="header-subtitle">Te vamos a enviar un código de 6 dígitos a tu correo electrónico.</p>
      </div>

      <div class="form-body">

        <!-- Opción -->
        <div class="method-option">
          <div class="method-option-icon">
            <span class="icon" id="option-icon">alternate_email</span>
          </div>
          <div class="method-option-text">
            <span class="method-option-title" id="option-title">Correo electrónico</span>
            <span class="method-option-subtitle" id="option-subtitle">Te enviaremos el código a <strong>corr***@eje****com</strong></span>
          </div>
        </div>

        <!-- Botones -->
        <div class="btn-row">
          <button class="btn-outline" onclick="history.back()">
            <span>Volver</span>
          </button>
          <button class="btn-primary active" onclick="continuar()">
            <span>Continuar</span>
          </button>
        </div>

      </div>

    </div><!-- /.main-card -->

    <!-- Footer -->
    <div class="card-footer">
      <span class="powered-label">POWERED BY</span>
      <img class="powered-logo" src="assets/icons/logo-fid.svg" alt="FID by Lakaut" />
    </div>

  </div><!-- /.card-wrap -->
  </main>

</div>

<script>
  /* El método ofrecido es siempre el OPUESTO al actual (si estás en SMS te
     ofrece pasar a email, y viceversa). */
  const actual = sessionStorage.getItem('otpMetodo') === 'email' ? 'email' : 'sms';
  const ofrecer = actual === 'email' ? 'sms' : 'email';

  if (ofrecer === 'sms') {
    document.getElementById('header-subtitle').textContent = 'Te vamos a enviar un mensaje de texto con un código de 6 dígitos.';
    document.getElementById('option-icon').textContent = 'sms';
    document.getElementById('option-title').textContent = 'Mensaje de texto (SMS)';
    document.getElementById('option-subtitle').innerHTML = 'Te enviaremos el código al <strong>+54 XXXXXXX 78</strong>';
  }

  function continuar() {
    sessionStorage.setItem('otpMetodo', ofrecer);
    window.location.href = 'firmar-otp.html';
  }
</script>
</body>
</html>
